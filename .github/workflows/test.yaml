name: test

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      # Setup Python
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install cocotb requirements
      - name: Install Python packages
        shell: bash
        run: |
          pip install -r test/requirements.txt

      # Run cocotb simulation
      - name: Run tests
        shell: bash
        run: |
          mkdir -p test
          export COCOTB_RESULTS_FILE=test/results.xml

          cd test
          make clean
          make

          echo "Files generated:"
          ls -lah
          test -f results.xml
          ! grep failure results.xml

      # Show test summary in GitHub Actions
      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      # Upload waveform and logs
      - name: Upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
